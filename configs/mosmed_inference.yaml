#INFERENCESINFERENCESINFERENCESINFERENCESINFERENCESINFERENCESINFERENCES
config_name: "config.yaml"
final_dir_name: "lesion_cnet_bert"
debug: False
# dataset_path: "/ssd_scratch/cvit/shreyu/datasets/ct_lesions/" # frames, masks, texts
dataset_path: "/ssd_scratch/cvit/shreyu/datasets/" # Images, Ground-Truths
dataset: "ct_lesions" # "qata", "ct_lesions"
fold: 0
model: "contextualnet" #"unet", "contextualnet", "cpam", "lvit", "mynetwork"
dataset_type: "image-text" #chnage to "image" for models that do not use text data
embedding: "bert" # bert
# dataset_type: "image" #chnage to "image" for models that do not use text data
pretrained_unet: "/ssd_scratch/cvit/shreyu/datasets/ct_lesions/output/lesion_cnet_bert/final_model.pth"
folds_file: "folds.csv"
inference_path: "/ssd_scratch/cvit/shreyu/datasets/inferences/"
text_path: "text.csv"
test: False
#INFERENCESINFERENCESINFERENCESINFERENCESINFERENCESINFERENCESINFERENCES


#wandb and checkpointing related
wandb_project: "mosmed"
wandb_run_name: "lesion-proposed-bert"
save_top_k: 5

#basic hyperparameters
num_epochs: 100 # 100
warmup_epochs: 5 # 5
weight_decay: 0.0001
learning_rate: 0.0001
momentum: 0.9
dropout: 0.1
img_size: 224
batch_size: 8
num_workers: 8
quad_num: 4

#model and run related
loss: "bce_dice"
alpha: 0.3
metric: "dice_metric"
optimizer: "AdamW"
scheduler: "LinearWarmupCosineAnnealingLR"
transform: True
in_channels: 1
text_in_channels: 30
out_channels: 1
bilinear: False
input_size: 256
bilinear: False
word_len: 77
base_lr: 0.0001
num_head: 8
t5_path: "/ssd_scratch/cvit/shreyu/datasets/ptx-textseg-dataset/t5_large/"
base_channel: 64
model_type: "bert"


